[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogcast"
version = "0.1.0"
description = "A two-resolution residual U-Net and native-footprint supervision showcase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["pyproj>=3.6", "xarray>=2024.1", "h5netcdf>=1.3", "Pillow>=10", "eccodes>=2.35"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["fogcast.residual_unet_fogcast.deprecated*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
norecursedirs = ["deprecated", ".*", "build", "dist"]
