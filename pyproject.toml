[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fogcast"
version = "0.1.0"
description = "Fogcast: A two-resolution residual U-Net"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["pyproj>=3.6", "xarray>=2024.1", "h5netcdf>=1.3", "Pillow>=10.1", "eccodes>=2.35", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["fogcast.deprecated*"]

[tool.setuptools.package-data]
"fogcast" = ["data/*.png", "data/*.json", "data/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
norecursedirs = ["deprecated", ".*", "build", "dist"]
